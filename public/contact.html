<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | UV's Petroleums</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-[#111418]">
  <header class="flex items-center justify-between px-10 py-4 border-b">
    <h1 class="text-xl font-bold">UV's Petroleums</h1>
    <nav class="space-x-6 text-sm font-medium">
      <a href="/" class="hover:text-blue-600">Home</a>
      <a href="/product" class="hover:text-blue-600">Products</a>
      <a href="/services" class="hover:text-blue-600">Services</a>
      <a href="/careers.html" class="hover:text-blue-600">Careers</a>
      <a href="/contact.html" class="text-blue-600 font-bold">Contact</a>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-6 py-16">
    <h2 class="text-4xl font-bold mb-6 text-center">Get in Touch</h2>
    <form action="/contact-form" method="POST" class="space-y-6 bg-gray-50 p-8 rounded-lg shadow">
      <div>
        <label for="name" class="block mb-1 font-medium">Name</label>
        <input type="text" name="name" id="name" required class="w-full border px-4 py-2 rounded" placeholder="Your full name" />
      </div>
      <div>
        <label for="email" class="block mb-1 font-medium">Email</label>
        <input type="email" name="email" id="email" required class="w-full border px-4 py-2 rounded" placeholder="you@example.com" />
      </div>
      <div>
        <label for="message" class="block mb-1 font-medium">Message</label>
        <textarea name="message" id="message" rows="4" required class="w-full border px-4 py-2 rounded" placeholder="How can we help you?"></textarea>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        Send Message
      </button>
    </form>
  </main>

  <footer class="text-center text-sm text-[#637488] py-6 border-t mt-10">
    © 2024 UV's Petroleums. All rights reserved.
  </footer>
</body>
</html>
